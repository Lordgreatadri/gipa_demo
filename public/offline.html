<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="theme-color" content="#075b3b">
        <title>Offline | IOMP</title>
        <style>
            * { box-sizing: border-box; }
            body { min-height: 100vh; display: grid; place-items: center; margin: 0; padding: 1.25rem; background: #f4f7f5; color: #14231d; font-family: sans-serif; }
            main { width: min(100%, 520px); padding: 2rem; border-top: 5px solid #e7b51d; background: white; box-shadow: 0 20px 55px rgba(11,54,36,.12); }
            .mark { width: 52px; height: 52px; display: grid; place-items: center; border: 4px double white; border-radius: 50%; background: #075b3b; color: white; font-weight: 800; }
            h1 { margin: 1.5rem 0 .75rem; font-size: 2rem; line-height: 1.15; }
            p { margin: 0 0 1.5rem; color: #65736d; line-height: 1.6; }
            button { min-height: 44px; padding: .7rem 1rem; border: 0; border-radius: 3px; background: #075b3b; color: white; font: inherit; font-weight: 700; cursor: pointer; }
            button:focus-visible { outline: 3px solid #e7b51d; outline-offset: 3px; }
        </style>
    </head>
    <body>
        <main>
            <div class="mark" aria-hidden="true">IO</div>
            <h1>You are currently offline</h1>
            <p>The live investment directory needs a connection. Previously visited public pages may still be available, and your secure account data has not been stored offline.</p>
            <button type="button" onclick="window.location.reload()">Try again</button>
        </main>
    </body>
</html>
