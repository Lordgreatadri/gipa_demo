openapi: 3.1.0
info:
  title: IOMP Platform API
  version: 1.0.0
  description: Versioned discovery, certificate verification, authentication, and investor matchmaking API.
servers:
  - url: /api/v1
tags:
  - name: Authentication
  - name: Public catalog
  - name: Opportunities
  - name: Investors
  - name: Certificates
paths:
  /auth/login:
    post:
      tags: [Authentication]
      summary: Issue an access JWT and opaque refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        "200":
          description: Token pair issued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenPair" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /auth/refresh:
    post:
      tags: [Authentication]
      summary: Rotate a refresh token and issue a new token pair
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string, minLength: 96, maxLength: 96 }
      responses:
        "200":
          description: Rotated token pair
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenPair" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /auth/logout:
    post:
      tags: [Authentication]
      summary: Revoke the current access and refresh session
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Session revoked }
        "401": { $ref: "#/components/responses/Unauthenticated" }
  /regions:
    get:
      tags: [Public catalog]
      summary: List regions
      responses:
        "200":
          description: Paginated region collection
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaginatedCollection" }
  /districts:
    get:
      tags: [Public catalog]
      summary: List published districts
      parameters:
        - { $ref: "#/components/parameters/Page" }
        - name: region
          in: query
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Paginated district collection
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaginatedCollection" }
  /sectors:
    get:
      tags: [Public catalog]
      summary: List sectors
      responses:
        "200":
          description: Paginated sector collection
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaginatedCollection" }
  /sub-sectors:
    get:
      tags: [Public catalog]
      summary: List sub-sectors
      parameters:
        - { $ref: "#/components/parameters/Page" }
        - name: sector
          in: query
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Paginated sub-sector collection
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaginatedCollection" }
  /opportunities:
    get:
      tags: [Opportunities]
      summary: Search published opportunities
      parameters:
        - { $ref: "#/components/parameters/Page" }
        - { name: query, in: query, schema: { type: string, maxLength: 120 } }
        - { name: region, in: query, schema: { type: string, format: uuid } }
        - { name: district, in: query, schema: { type: string, format: uuid } }
        - { name: sector, in: query, schema: { type: string, format: uuid } }
        - { name: type, in: query, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Paginated opportunity collection
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaginatedCollection" }
  /opportunities/{uuid}:
    get:
      tags: [Opportunities]
      summary: Get one published opportunity
      parameters:
        - { $ref: "#/components/parameters/Uuid" }
      responses:
        "200":
          description: Published opportunity
          content:
            application/json:
              schema: { type: object }
        "404": { description: Opportunity not found or not public }
  /certificates/{token}/verify:
    get:
      tags: [Certificates]
      summary: Verify a certificate using its opaque public token
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string, minLength: 64, maxLength: 64 }
      responses:
        "200": { description: Public certificate validity snapshot }
        "404": { description: Certificate not found }
  /investor/me:
    get:
      tags: [Investors]
      summary: Get the authenticated investor profile
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Own investor profile without KYC evidence
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { description: Investor account required }
  /investor/preferences:
    put:
      tags: [Investors]
      summary: Replace the authenticated investor's matching preferences
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MatchPreferenceInput" }
      responses:
        "200": { description: Preferences updated }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /investor/matches:
    get:
      tags: [Investors]
      summary: Get up to 12 explainable opportunity matches
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Deterministically ranked matching opportunities
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    maxItems: 12
                    items: { $ref: "#/components/schemas/OpportunityMatch" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1 }
    Uuid:
      name: uuid
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    Unauthenticated:
      description: Missing, expired, malformed, or revoked access token
    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema:
            type: object
            properties:
              message: { type: string }
              errors:
                {
                  type: object,
                  additionalProperties:
                    { type: array, items: { type: string } },
                }
  schemas:
    TokenPair:
      type: object
      required:
        [
          token_type,
          access_token,
          expires_in,
          refresh_token,
          refresh_expires_at,
        ]
      properties:
        token_type: { type: string, const: Bearer }
        access_token: { type: string }
        expires_in: { type: integer, description: Seconds until access expiry }
        refresh_token: { type: string }
        refresh_expires_at: { type: string, format: date-time }
    PaginatedCollection:
      type: object
      required: [data, links, meta]
      properties:
        data: { type: array, items: { type: object } }
        links: { type: object }
        meta: { type: object }
    MatchPreferenceInput:
      type: object
      required: [sector_uuids, region_uuids, currency]
      properties:
        sector_uuids:
          {
            type: array,
            minItems: 1,
            maxItems: 10,
            items: { type: string, format: uuid },
          }
        region_uuids:
          {
            type: array,
            minItems: 1,
            maxItems: 16,
            items: { type: string, format: uuid },
          }
        minimum_investment: { type: number, minimum: 0, nullable: true }
        maximum_investment: { type: number, minimum: 0, nullable: true }
        currency: { type: string, enum: [GHS, USD, EUR, GBP] }
        minimum_readiness_score:
          { type: number, minimum: 0, maximum: 100, nullable: true }
    OpportunityMatch:
      type: object
      required: [score, reasons, opportunity]
      properties:
        score: { type: integer, minimum: 0, maximum: 100 }
        reasons: { type: array, items: { type: string } }
        opportunity: { type: object }
